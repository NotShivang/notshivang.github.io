# External plugins
plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-paginate-v2

exclude:
  - "/vendor/"

# Site settings
title: Shivang Arya
subtitle: ""
name: Shivang Arya
description: >
  Personal website and blog.
baseurl: ""
url: ""
cover: "/assets/header_image.jpg"
logo: "/assets/logo.png"

# Build settings
markdown: kramdown
inter_post_navigation: false
highlightjs_theme: "monokai-sublime"

# Pagination Settings
pagination:
  enabled: true
  per_page: 5
  permalink: "/page/:num/"
  sort_reverse: true

# Archive settings (see https://github.com/jekyll/jekyll-archives/)
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: 'archive'
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'

# Category descriptions (for archive pages)
descriptions:
  - cat: jekyll
    desc: "Posts describing Jekyll setup techniques."

# Social icons and sharing options
social:
  - name: GitHub
    icon: github
    username: NotShivang
    url: https://github.com/NotShivang
    desc: Fork me on GitHub
    share: false

  - name: LinkedIn
    icon: linkedin
    username: Shivang Arya
    url: https://www.linkedin.com/in/shivangarya/
    desc: Connect with me on LinkedIn
    share: true
