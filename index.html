<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: oklch(97.5% 0.006 215);
    --bg2: oklch(93% 0.009 215);
    --text: oklch(14% 0.014 220);
    --text-muted: oklch(46% 0.01 220);
    --accent: oklch(62% 0.16 210);
    --accent-2: oklch(45% 0.18 240);
    --accent-light: oklch(93% 0.04 210);
    --rule: oklch(84% 0.009 215);
    --sidebar-w: 268px;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans: 'DM Sans', system-ui, sans-serif;
  }
  html, body, #root { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }
  @keyframes fillBar { from { width:0 } to { width: var(--fill-w) } }
  * { transition: color 0.3s, background-color 0.3s, border-color 0.3s; }

  /* ── Mobile ── */
  #mob-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.38); z-index:18; }
  #mob-overlay.visible { display:block; }
  #hamburger {
    display:none; position:fixed; top:14px; right:14px; z-index:22;
    background:var(--bg); border:1px solid var(--rule); border-radius:8px;
    width:40px; height:40px; cursor:pointer; align-items:center; justify-content:center;
    flex-direction:column; gap:5px; padding:0; transition:background 0.2s;
  }
  #hamburger span { display:block; width:18px; height:1.5px; background:var(--text); border-radius:2px; transition:transform 0.25s, opacity 0.25s; }
  #hamburger.open span:nth-child(1) { transform:translateY(6.5px) rotate(45deg); }
  #hamburger.open span:nth-child(2) { opacity:0; }
  #hamburger.open span:nth-child(3) { transform:translateY(-6.5px) rotate(-45deg); }

  @media (max-width: 768px) {
    :root { --sidebar-w: 0px; }
    #hamburger { display:flex; }

    .sidebar {
      transform: translateX(-268px) !important;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1) !important;
      width: 268px !important;
      background: var(--bg) !important;
      box-shadow: none;
    }
    .sidebar.mob-open {
      transform: translateX(0) !important;
      box-shadow: 4px 0 32px rgba(0,0,0,0.12);
    }

    .page-main {
      margin-left: 0 !important;
      padding: 56px 22px 64px !important;
      max-width: 100% !important;
    }

    .grid-2col { grid-template-columns: 1fr !important; }

    .chess-wrap { flex-direction: column !important; }
    .chess-movelist { max-height: 180px !important; }

    .feat-grid { grid-template-columns: 1fr !important; max-width: 100% !important; }

    .seg-inner { flex-direction: column !important; gap: 12px !important; }

    .home-h1 { font-size: clamp(2.2rem, 10vw, 5.2rem) !important; }
  }
</style>

<div id="mob-overlay" onclick="closeMobNav()"></div>
<button id="hamburger" onclick="toggleMobNav()" aria-label="Menu">

<script>
function toggleMobNav(){
  const open = document.getElementById('hamburger').classList.toggle('open');
  document.querySelector('.sidebar')?.classList.toggle('mob-open', open);
  document.getElementById('mob-overlay').classList.toggle('visible', open);
}
function closeMobNav(){
  document.getElementById('hamburger').classList.remove('open');
  document.querySelector('.sidebar')?.classList.remove('mob-open');
  document.getElementById('mob-overlay').classList.remove('visible');
}
</script>

// ── Router ────────────────────────────────────────────
function useRoute() {
  const [route, setRoute] = useState(() => window.location.hash.replace('#', '') || 'home');
  useEffect(() => {
    const h = () => setRoute(window.location.hash.replace('#', '') || 'home');
    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);
  return [route, (r) => {window.location.hash = r;}];
}

    onMouseLeave={(e) => {if (!active) e.currentTarget.style.color = 'var(--text-muted)';}}>
      {label}

}

// ── Chess Engine ──────────────────────────────────────
class ChessEngine {
  constructor() {this.reset();}
  reset() {
    this.board = [
    ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
    ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
    [null, null, null, null, null, null, null, null],
    [null, null, null, null, null, null, null, null],
    [null, null, null, null, null, null, null, null],
    [null, null, null, null, null, null, null, null],
    ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
    ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']];

    this.turn = 'w';this.ep = null;this.lastMove = null;
  }
  F = { a: 0, b: 1, c: 2, d: 3, e: 4, f: 5, g: 6, h: 7 };
  move(san) {
    san = san.replace(/[+#!?]/g, '');
    const b = this.board.map((r) => [...r]);const w = this.turn === 'w';
    let from = null,to = null;
    if (san === 'O-O' || san === '0-0') {
      const row = w ? 7 : 0;
      b[row][4] = null;b[row][7] = null;b[row][6] = w ? 'K' : 'k';b[row][5] = w ? 'R' : 'r';
      from = [row, 4];to = [row, 6];this.ep = null;
    } else if (san === 'O-O-O' || san === '0-0-0') {
      const row = w ? 7 : 0;
      b[row][4] = null;b[row][0] = null;b[row][2] = w ? 'K' : 'k';b[row][3] = w ? 'R' : 'r';
      from = [row, 4];to = [row, 2];this.ep = null;
    } else {
      let s = san,promo = null;
      if (s.includes('=')) {{const p = s.split('=');s = p[0];promo = p[1];}}
      s = s.replace('x', '');
      let pt = 'P';
      if ('NBRQK'.includes(s[0])) {pt = s[0];s = s.slice(1);}
      const toCol = this.F[s.at(-2)],toRow = 8 - parseInt(s.at(-1));
      const dis = s.slice(0, -2);
      let dF = null,dR = null;
      if (dis.length === 1) {'abcdefgh'.includes(dis) ? dF = this.F[dis] : dR = 8 - parseInt(dis);} else
      if (dis.length === 2) {dF = this.F[dis[0]];dR = 8 - parseInt(dis[1]);}
      const pc = w ? pt : pt.toLowerCase();
      let fr = -1,fc = -1;
      if (pt === 'P') {
        if (dF !== null) {
          fc = dF;fr = w ? toRow + 1 : toRow - 1;
          if (b[toRow][toCol] === null && this.ep && this.ep[0] === toRow && this.ep[1] === toCol)
          b[w ? toRow + 1 : toRow - 1][toCol] = null;
          this.ep = null;
        } else {
          fc = toCol;
          const dir = w ? 1 : -1;
          fr = b[toRow + dir] && b[toRow + dir][fc] === pc ? toRow + dir : toRow + 2 * dir;
          this.ep = Math.abs(fr - toRow) === 2 ? [(fr + toRow) / 2, toCol] : null;
        }
        fr = Math.max(0, Math.min(7, fr));
      } else {
        this.ep = null;
        loop: for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
          if (b[r][c] !== pc) continue;
          if (dF !== null && c !== dF) continue;
          if (dR !== null && r !== dR) continue;
          if (this._reach(b, pt, r, c, toRow, toCol)) {fr = r;fc = c;break loop;}
        }
      }
      if (fr < 0) {console.warn('No piece for move:', san, pc);return;}
      to = [toRow, toCol];from = [fr, fc];
      b[toRow][toCol] = promo ? w ? promo.toUpperCase() : promo.toLowerCase() : pc;
      b[fr][fc] = null;
    }
    this.lastMove = { from, to };this.board = b;this.turn = w ? 'b' : 'w';
  }
  _reach(b, pt, fr, fc, tr, tc) {
    const dr = tr - fr,dc = tc - fc;
    if (pt === 'N') return Math.abs(dr) === 2 && Math.abs(dc) === 1 || Math.abs(dr) === 1 && Math.abs(dc) === 2;
    if (pt === 'K') return Math.abs(dr) <= 1 && Math.abs(dc) <= 1;
    if (pt === 'B' && Math.abs(dr) !== Math.abs(dc)) return false;
    if (pt === 'R' && dr !== 0 && dc !== 0) return false;
    if (pt === 'Q' && dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return false;
    const sr = Math.sign(dr),sc = Math.sign(dc);let r = fr + sr,c = fc + sc;
    while (r !== tr || c !== tc) {if (b[r]?.[c] != null) return false;r += sr;c += sc;}
    return true;
  }
}

// ── Chess Navigator ───────────────────────────────────
const GLYPHS = { 'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙', 'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟' };

function ChessNavigator({ pgn, result, orientation = 'white' }) {
  const moves = React.useMemo(() => pgn.trim().split(/\s+/).filter((t) => t.length > 0 && !/^\d+\./.test(t)), [pgn]);
  const states = React.useMemo(() => {
    const eng = new ChessEngine();
    const ss = [{ board: eng.board.map((r) => [...r]), lastMove: null }];
    for (const m of moves) {try {eng.move(m);} catch (e) {console.warn(e);}ss.push({ board: eng.board.map((r) => [...r]), lastMove: eng.lastMove });}
    return ss;
  }, [pgn]);

  const [idx, setIdx] = useState(0);
  const { board, lastMove } = states[Math.min(idx, states.length - 1)];
  const flip = orientation === 'black';

  useEffect(() => {
    const h = (e) => {if (e.key === 'ArrowLeft') setIdx((i) => Math.max(0, i - 1));if (e.key === 'ArrowRight') setIdx((i) => Math.min(states.length - 1, i + 1));};
    window.addEventListener('keydown', h);return () => window.removeEventListener('keydown', h);
  }, [states.length]);

  const SQ = 26;
  const rows = flip ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
  const cols = flip ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
  const files = 'abcdefgh';
  const ranks = '87654321';

  const movePairs = [];
  for (let i = 0; i < moves.length; i += 2) movePairs.push({ num: Math.floor(i / 2) + 1, w: moves[i], b: moves[i + 1] || null, wi: i + 1, bi: i + 2 });

  const btnStyle = (disabled) => ({ background: 'none', border: 'none', cursor: disabled ? 'default' : 'pointer', color: disabled ? 'var(--rule)' : 'var(--text-muted)', fontSize: '0.72rem', padding: '4px 6px', fontFamily: 'var(--font-sans)', fontWeight: 300 });

  return (
    <div className="chess-wrap" style={{ display: 'flex', gap: 28, alignItems: 'flex-start', flexWrap: 'wrap' }}>
      <div style={{ flexShrink: 0 }}>
        <div style={{ display: 'grid', gridTemplateColumns: `16px repeat(8,${SQ}px)`, gridTemplateRows: `repeat(8,${SQ}px) 16px`, gap: 0 }}>
          {rows.map((row, ri) => [
          <div key={`rank-${ri}`} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.6rem', color: 'var(--text-muted)', fontFamily: 'var(--font-sans)' }}>{flip ? ri + 1 : 8 - ri}</div>,
          ...cols.map((col, ci) => {
            const piece = board[row][col];
            const isFrom = lastMove?.from[0] === row && lastMove?.from[1] === col;
            const isTo = lastMove?.to[0] === row && lastMove?.to[1] === col;
            const light = (row + col) % 2 === 0;
            return (
              <div key={`${row}-${col}`} style={{ width: SQ, height: SQ, background: isFrom || isTo ? 'var(--accent-light)' : light ? 'var(--bg)' : 'var(--bg2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: SQ * 0.7, lineHeight: 1, userSelect: 'none', position: 'relative', cursor: 'default', border: isTo ? '1px solid var(--accent)' : 'none' }}>
                  {isTo && <div style={{ position: 'absolute', inset: 0, background: 'var(--accent)', opacity: 0.15 }} />}
                  <span style={{ position: 'relative', color: piece && piece === piece.toUpperCase() ? 'var(--text)' : 'var(--accent)', textShadow: piece && piece === piece.toUpperCase() ? '0 0 1px rgba(0,0,0,0.3)' : 'none' }}>{piece ? GLYPHS[piece] : ''}</span>
                </div>);

          })]
          )}
          <div />
          {cols.map((col, ci) =>
          <div key={`file-${ci}`} style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', paddingTop: 3, fontSize: '0.6rem', color: 'var(--text-muted)', fontFamily: 'var(--font-sans)' }}>{files[col]}</div>
          )}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 10, gap: 4 }}>
          <button style={btnStyle(idx === 0)} onClick={() => setIdx(0)} disabled={idx === 0}>⟨⟨</button>
          <button style={btnStyle(idx === 0)} onClick={() => setIdx((i) => Math.max(0, i - 1))} disabled={idx === 0}>‹ Prev</button>
          <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)', fontWeight: 300, minWidth: 50, textAlign: 'center' }}>{idx} / {moves.length}</span>
          <button style={btnStyle(idx >= states.length - 1)} onClick={() => setIdx((i) => Math.min(states.length - 1, i + 1))} disabled={idx >= states.length - 1}>Next ›</button>
          <button style={btnStyle(idx >= states.length - 1)} onClick={() => setIdx(states.length - 1)} disabled={idx >= states.length - 1}>⟩⟩</button>
        </div>
        <div style={{ fontSize: '0.68rem', color: 'var(--text-muted)', textAlign: 'center', marginTop: 4, opacity: 0.5 }}>← → keys to navigate</div>
      </div>

      <div className="chess-movelist" style={{ flex: 1, minWidth: 160, maxHeight: SQ * 8 + 16, overflowY: 'auto' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'auto 1fr 1fr', gap: '1px 4px', fontSize: '0.75rem', fontFamily: 'monospace' }}>
          {movePairs.map(({ num, w, b, wi, bi }) =>
          <React.Fragment key={num}>
              <span style={{ color: 'var(--text-muted)', opacity: 0.45, textAlign: 'right', padding: '2px 4px' }}>{num}.</span>
              <span onClick={() => setIdx(wi)} style={{ cursor: 'pointer', padding: '2px 5px', borderRadius: 2, background: idx === wi ? 'var(--accent-light)' : 'none', color: idx === wi ? 'var(--accent)' : 'var(--text-muted)', fontWeight: idx === wi ? 500 : 300 }}>{w}</span>
              {b ? <span onClick={() => setIdx(bi)} style={{ cursor: 'pointer', padding: '2px 5px', borderRadius: 2, background: idx === bi ? 'var(--accent-light)' : 'none', color: idx === bi ? 'var(--accent)' : 'var(--text-muted)', fontWeight: idx === bi ? 500 : 300 }}>{b}</span> : <span />}
            </React.Fragment>
          )}
        </div>
        <div style={{ marginTop: 10, fontSize: '0.7rem', color: 'var(--text-muted)', fontWeight: 500, letterSpacing: '0.04em' }}>{result}</div>
      </div>
    </div>);

}

    icon: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect x="2" y="9" width="4" height="12" /><circle cx="4" cy="4" r="2" /></svg> }];

  return (
    <div>
      <Label>Contact</Label>
      <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: '3rem', fontWeight: 300, lineHeight: 1.1, marginBottom: 12 }}>
        Say hello.
      </h1>
      <p style={{ color: 'var(--text-muted)', fontWeight: 300, marginBottom: 52, maxWidth: 440, lineHeight: 1.75 }}>
        I'm not hard to find.
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
        {links.map((l) =>
        <a key={l.url} href={l.url} target="_blank" rel="noopener" style={{ display: 'flex', alignItems: 'center', gap: 22, padding: '26px 22px', background: 'var(--bg2)', textDecoration: 'none', color: 'var(--text)', borderLeft: '2px solid transparent', transition: 'background 0.2s, border-color 0.2s' }}
        onMouseEnter={(e) => {e.currentTarget.style.background = 'var(--accent-light)';e.currentTarget.style.borderLeftColor = 'var(--accent)';}}
        onMouseLeave={(e) => {e.currentTarget.style.background = 'var(--bg2)';e.currentTarget.style.borderLeftColor = 'transparent';}}>
            <div style={{ color: 'var(--accent)' }}>{l.icon}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: 'var(--font-serif)', fontSize: '1.2rem', fontWeight: 600, marginBottom: 3 }}>{l.name}</div>
              <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)', fontWeight: 300 }}>{l.handle} · {l.desc}</div>
            </div>
            <div style={{ color: 'var(--text-muted)', fontSize: '1.1rem' }}>→</div>
          </a>
        )}
      </div>
    </div>);

}

// ── App ───────────────────────────────────────────────
function App() {
  const [route, go] = useRoute();
  const pages = { home: HomePage, about: AboutPage, projects: ProjectsPage, blog: BlogPage, contact: ContactPage };
  const Active = pages[route] || HomePage;
  return (
    <>
      <Sidebar route={route} go={go} />
      <Page route={route}><Active go={go} /></Page>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
